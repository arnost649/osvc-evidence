<div id="supplier-verification-modal" class="supplier-verification-modal" hidden role="dialog" aria-modal="true" aria-labelledby="supplier-verification-title">
  <div class="supplier-verification-panel">
    <button type="button" class="supplier-verification-close" aria-label="Zavřít">×</button>
    <h2 id="supplier-verification-title">Ověření subjektu</h2>
    <div data-verification-body><p>Načítám údaje…</p></div>
    <p class="verification-error" data-verification-error hidden></p>
    <div class="verification-actions"><button type="button" data-verification-apply hidden>Použít ověřené údaje</button><button type="button" class="secondary" data-verification-cancel>Ponechat původní</button></div>
  </div>
</div>
