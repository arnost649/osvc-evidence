  <rect x="310" y="198" width="110" height="32" rx="4" fill="#3a3982" stroke="#8f8ec7"/><text x="365" y="219" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Nespouštět</text>
  <text x="24" y="236" fill="#a9a8d6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">ilustrační obrázek</text>
