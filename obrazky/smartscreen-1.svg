<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250" role="img" aria-label="Ilustrace okna Systém Windows ochránil váš počítač – krok 1: klikněte na „Další informace“">
  <title>Krok 1: klikněte na „Další informace“ (ilustrační obrázek)</title>
  <rect x="0.5" y="0.5" width="439" height="249" rx="8" fill="#2b2a6b" stroke="#3d3c86"/>
  <text x="408" y="30" fill="#e6e6f5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">×</text>
  <text x="24" y="52" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600">Systém Windows ochránil váš počítač</text>
  <text fill="#e6e6f5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5"><tspan x="24" y="88">Filtr SmartScreen zabránil spuštění nerozpoznané aplikace.</tspan><tspan x="24" y="106">Spuštění této aplikace by mohlo ohrozit váš počítač.</tspan></text>
